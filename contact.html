<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜pretty flower</title>
<style>
  :root {
    --main-pink: #e8a0a8;
    --deep-pink: #c97b86;
    --bg: #fff9f7;
    --text: #4a3f3d;
    --border: #eadcd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  header {
    text-align: center;
    padding: 40px 20px 20px;
  }
  header h1 {
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    margin: 0 0 6px;
    color: var(--deep-pink);
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    color: #8a7a77;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .lead {
    font-size: 0.9rem;
    margin: 0 0 24px;
    color: #6b5a57;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 6px;
    color: var(--deep-pink);
  }
  .field {
    margin-bottom: 20px;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: #fffdfc;
    color: var(--text);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--main-pink);
  }
  textarea {
    resize: vertical;
    min-height: 140px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: var(--main-pink);
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: var(--deep-pink);
  }
  nav {
    text-align: center;
    margin-top: 28px;
    font-size: 0.85rem;
  }
  nav a {
    color: var(--deep-pink);
    text-decoration: none;
    margin: 0 8px;
  }
  nav a:hover {
    text-decoration: underline;
  }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #b3a3a0;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>お問い合わせ</h1>
  <p>pretty flower</p>
</header>

<main>
  <div class="card">
    <p class="lead">ご質問・ご相談など、お気軽にお送りください。<br>1〜2営業日以内にご返信いたします。</p>

    <!-- ↓ action の YOUR_FORM_ID を、Formspreeで発行されたご自身のフォームIDに置き換えてください -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit">送信する</button>
    </form>
  </div>

  <nav>
    <a href="index.html">トップへ戻る</a> |
    <a href="faq.html">よくある質問</a>
  </nav>
</main>

<footer>© 2026 pretty flower</footer>

</body>
</html>
