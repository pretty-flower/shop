<script>
var calYear=new Date().getFullYear();
var calMonth=new Date().getMonth();
function renderCal(){
  var today=new Date();today.setHours(0,0,0,0);
  var minDate=new Date(today);minDate.setDate(today.getDate()+2);
  var first=new Date(calYear,calMonth,1);
  var last=new Date(calYear,calMonth+1,0);
  var monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var h='<div class="cal-nav">';
  h+='<button onclick="prevMonth()">‹</button>';
  h+='<span>'+calYear+'年 '+monthNames[calMonth]+'</span>';
  h+='<button onclick="nextMonth()">›</button>';
  h+='</div>';
  h+='<div class="cal-grid">';
  var dows=['日','月','火','水','木','金','土'];
  var dowCls=['sun','','','','','','sat'];
  for(var i=0;i<7;i++) h+='<div class="cal-dow '+dowCls[i]+'">'+dows[i]+'</div>';
  for(var i=0;i<first.getDay();i++) h+='<div class="cal-day empty"></div>';
  for(var d=1;d<=last.getDate();d++){
    var dt=new Date(calYear,calMonth,d);
    var dow=dt.getDay();
    var disabled=dt<minDate||(dow===0||dow===1||dow===2);
    var sel=S.calDate&&S.calDate.getFullYear()===calYear&&S.calDate.getMonth()===calMonth&&S.calDate.getDate()===d;
    var cls='cal-day'+(dow===0?' sun':dow===6?' sat':'')+(disabled?' disabled':''+(sel?' on':''));
    if(disabled){
      h+='<div class="'+cls+'">'+d+'</div>';
    }else{
      h+='<div class="'+cls+'" onclick="pickCalDate('+calYear+','+calMonth+','+d+')">'+d+'</div>';
    }
  }
  h+='</div>';
  return h;
}
function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();}
function pickCalDate(y,m,d){S.calDate=new Date(y,m,d);S.date=S.calDate;if(S.time&&timesForDate(S.calDate).indexOf(S.time)===-1){S.time=null;}render();}

var S={step:1,purpose1:null,purpose2:null,kuyo:null,style:null,mood:null,price:null,custPrice:'',date:null,calDate:null,time:null,name:'',tel:'',email:'',bag:false,card:false,note:''};
var p1list=[{id:'gift',name:'ギフト'},{id:'self',name:'自宅用'}];
var p2list=[{id:'cele',name:'お祝い'},{id:'kuyo',name:'お供え'},{id:'other',name:'その他'}];
var kuyoC=[{id:'any',name:'おまかせ（色OK）'},{id:'white',name:'白系に淡い差し色'}];
var styles=[{id:'bq',icon:'💐',name:'花束',desc:''},{id:'ba',icon:'🧺',name:'カゴアレンジ',desc:'アレンジメント'},{id:'st',icon:'🌷',name:'置くだけブーケ',desc:'スタンディング'},{id:'kumi',icon:'🌾',name:'組み束',desc:''}];
var moods=[{id:'kise',icon:'✨',name:'季節のおまかせ',desc:'旬の花をお任せで'},{id:'fuwa',icon:'🌸',name:'ふわふわ',desc:'淡いピンクなど'},{id:'hira',icon:'🌹',name:'ひらひら',desc:'赤など 華やかな雰囲気'},{id:'yura',icon:'🌿',name:'ゆらゆら',desc:'白・グリーン 爽やか系'},{id:'natu',icon:'🌼',name:'ナチュラル',desc:'イエローなど'}];
var prices=[{id:'p3300',label:'3,300円',size:'手のひらサイズ',kumiSize:'長さ約35〜45cm・小ぶり',tag:'S',tagDesc:'小さな贈りもの',scene:'ちょっとしたお礼・気軽なプレゼントに。'},{id:'p4400',label:'4,400円',size:'幅約22cm程度',kumiSize:'長さ約45〜50cm・ボリューム感',tag:'M',tagDesc:'季節を贈る',scene:'季節のお花を少し華やかに楽しみたい方へ。'},{id:'p5500',label:'5,500円',size:'幅約25〜30cm',kumiSize:'長さ約50〜60cm・ボリュームあり',tag:'L',tagDesc:'人気No.1✨',scene:'お誕生日・記念日・母の日など、迷ったらこちらがおすすめです。'},{id:'p6600',label:'6,600円',size:'幅約30cm・ボリューム',kumiSize:'長さ約60cm・華やかな印象',tag:'L+',tagDesc:'ワンランク上',scene:'いつもより少し贈りものにボリュームを持たせたい時に。'},{id:'p8800',label:'8,800円',size:'幅約35cm・存在感',kumiSize:'長さ約60cm以上・存在感たっぷり',tag:'LL',tagDesc:'華やぎを添えて',scene:'ボリューム感があり、特別な日の贈りものに。'},{id:'p11000',label:'11,000円',size:'幅約40cm・豪華',kumiSize:'長さ60cm以上・法事・葬儀向け',tag:'XL',tagDesc:'とっておきの贈りもの',scene:'開店祝い・周年祝いなど、特別なお祝いに。ご希望に合わせてお作りします。'}];
var now=new Date();
var days=['日','月','火','水','木','金','土'];
// 特定日だけ受付時間を短縮したい場合はここに追加（YYYY-MM-DD形式）
var dateTimeOverrides={
  '2026-07-18':['10:00〜11:00','11:00〜12:00','12:00〜13:00','13:00〜14:00','14:00〜15:00','15:00〜16:00']
};
function timesForDate(d){
  if(!d) return ['10:00〜11:00','11:00〜12:00','12:00〜13:00','13:00〜14:00','14:00〜15:00','15:00〜16:00','16:00〜17:00','17:00〜18:00'];
  var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return dateTimeOverrides[key]||['10:00〜11:00','11:00〜12:00','12:00〜13:00','13:00〜14:00','14:00〜15:00','15:00〜16:00','16:00〜17:00','17:00〜18:00'];
}

function purpose(){return S.purpose1||S.purpose2;}
function totalSteps(){return 6;}

function renderSteps(){
  var n=totalSteps(),h='';
  for(var i=1;i<=n;i++){
    var cls=i===S.step?'dot active':i<S.step?'dot done':'dot';
    h+='<div class="'+cls+'"></div>';
  }
  document.getElementById('steps').innerHTML=h;
}

function render(){
  renderSteps();
  var c=document.getElementById('main');
  var h='';

  if(S.step===1){
    h='<div class="card"><div class="sec">用途を選んでください</div><div class="chips">';
    for(var i=0;i<p1list.length;i++){var p=p1list[i];h+='<div class="chip'+(S.purpose1===p.id?' on':'')+'\" onclick="selP1(\''+p.id+'\')">'+p.name+'</div>';}
    h+='</div></div>';

  }else if(S.step===2){
    h='<div class="card"><div class="sec">用途を選んでください</div><div class="chips">';
    for(var i=0;i<p2list.length;i++){var p=p2list[i];h+='<div class="chip'+(S.purpose2===p.id?' on':'')+'\" onclick="selP2(\''+p.id+'\')">'+p.name+'</div>';}
    h+='</div></div>';
    h+='<button class="btn" '+(S.purpose2?'':'disabled')+' onclick="go()">次へ →</button>';
    h+='<button class="bbk" onclick="back()">← もどる</button>';

  }else if(S.step===3){
    h='<div class="card"><div class="sec">スタイルを選んでください</div><div class="g3">';
    for(var i=0;i<styles.length;i++){var s=styles[i];h+='<div class="tile'+(S.style===s.id?' on':'')+'\" onclick="pick(\'style\',\''+s.id+'\')"><div class="ticon">'+s.icon+'</div><div class="tname">'+s.name+'</div>'+(s.desc?'<div class="tdesc">'+s.desc+'</div>':'')+'</div>';}
    h+='</div></div>';
    h+='<button class="btn" '+(S.style?'':'disabled')+' onclick="go()">色合いを選ぶ →</button>';
    h+='<button class="bbk" onclick="back()">← もどる</button>';

  }else if(S.step===4){
    if(S.purpose2==='kuyo'){
      h='<div class="card"><div class="sec">色合いを選んでください</div><div class="chips">';
      for(var i=0;i<kuyoC.length;i++){var k=kuyoC[i];h+='<div class="chip'+(S.kuyo===k.id?' on':'')+'\" onclick="pick(\'kuyo\',\''+k.id+'\')">'+k.name+'</div>';}
      h+='</div></div>';
      h+='<button class="btn" '+(S.kuyo?'':'disabled')+' onclick="go()">金額を選ぶ →</button>';
    }else{
      h='<div class="card"><div class="sec">色合いを選んでください</div><div class="g2">';
      for(var i=0;i<moods.length;i++){var m=moods[i];h+='<div class="tile'+(S.mood===m.id?' on':'')+'\" onclick="pick(\'mood\',\''+m.id+'\')"><div class="ticon">'+m.icon+'</div><div class="tname">'+m.name+'</div><div class="tdesc">'+m.desc+'</div></div>';}
      h+='</div></div>';
      h+='<button class="btn" '+(S.mood?'':'disabled')+' onclick="go()">金額を選ぶ →</button>';
    }
    h+='<button class="bbk" onclick="back()">← もどる</button>';

  }else if(S.step===5){
    h='<div class="card"><div class="sec">ご予算を選んでください</div>';
    h+='<a href="gallery.html" target="_blank" class="gallery-link">📷 参考画像はこちら</a>';
    h+='<div class="pc-list">';
    if(S.style==='kumi'){h+='<div class="pcard'+(S.price==='p2200'?' on':'')+'" onclick="pickPrice(\'p2200\')"><div class="pcard-head"><span class="pcprice">2,200円<span style="font-size:11px;color:#a08878;font-weight:400"> 税込</span></span></div><div class="pcsize">長さ約30〜35cm・小ぶり</div></div>';}
    for(var i=0;i<prices.length;i++){
      var p=prices[i];
      var sz=S.style==='kumi'?(p.kumiSize||p.size):p.size;
      h+='<div class="pcard'+(S.price===p.id?' on':'')+'" onclick="pickPrice(\''+p.id+'\')">';
      h+='<div class="pcard-head"><span class="ptagbadge">'+p.tag+'</span><span class="ptagname">'+p.tagDesc+'</span><span class="pcprice">'+p.label+'<span style="font-size:11px;color:#a08878;font-weight:400"> 税込</span></span></div>';
      h+='<div class="pcscene">'+p.scene+'</div>';
      h+='<div class="pcsize">'+sz+'</div>';
      h+='</div>';
    }
    h+='</div>';
    if(S.style==='kumi'){h+='<div style="font-size:12px;color:#9a7060;background:#faf4f0;border:.5px solid #e8d8d0;border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.7">季節のお供えに相応しいお花で組みます。<br>対でご希望の場合は、下のご希望欄にご記入ください。</div>';}
    h+='<label class="lbl" style="margin-top:12px">ご予算を直接入力（任意）</label>';
    h+='<input type="text" placeholder="例：7,000円くらい" value="'+S.custPrice+'" oninput="S.custPrice=this.value;S.price=null;renderSteps()">';
    h+='</div>';
    h+='<button class="btn" '+(!S.price&&!S.custPrice?'disabled':'')+' onclick="go()">日時・お客様情報へ →</button>';
    h+='<button class="bbk" onclick="back()">← もどる</button>';

  }else if(S.step===6){
    h='<div class="card"><div class="sec">来店日を選んでください</div>'+renderCal()+'<div class="tg">';
    var times=timesForDate(S.calDate);
    for(var i=0;i<times.length;i++){var t=times[i];h+='<div class="tb'+(S.time===t?' on':'')+'\" onclick="pickTime(\''+t+'\')">'+t+'</div>';}
    h+='</div></div>';
    h+='<div class="card"><div class="sec">お客様情報・ご要望</div>';
    h+='<label class="lbl">お名前<span class="req">※必須</span></label>';
    h+='<input type="text" id="nmInput" placeholder="例：山田 花子" value="'+S.name+'" oninput="S.name=this.value">';
    h+='<label class="lbl">電話番号（連絡の取れる番号）<span class="req">※必須</span></label>';
    h+='<input type="tel" placeholder="例：090-0000-0000" value="'+S.tel+'" oninput="S.tel=this.value">';
    h+='<label class="lbl">メールアドレス<span class="req">※必須</span></label>';
    h+='<input type="email" placeholder="例：hanako@example.com" value="'+S.email+'" oninput="S.email=this.value">';
    h+='<div style="margin-top:16px">';
    h+='<div class="oi'+(S.bag?' on':'')+'\" onclick="tog(\'bag\')"><div class="chk'+(S.bag?' on':'')+'\">'+(S.bag?'✓':'')+'</div><div><div style="font-size:13px">紙袋（有料）</div><div style="font-size:11px;color:#a08878">大きさによって現地精算 100〜300円</div></div></div>';
    h+='<div class="oi'+(S.card?' on':'')+'\" onclick="tog(\'card\')"><div class="chk'+(S.card?' on':'')+'\">'+(S.card?'✓':'')+'</div><div><div style="font-size:13px">メッセージカード（無料）</div><div style="font-size:11px;color:#a08878">必要な場合は備考にご記入ください</div></div></div>';
    h+='</div>';
    h+='<label class="lbl">その他のご希望・メッセージカードの内容（任意）</label>';
    h+='<textarea placeholder="色のご希望、メッセージカードの内容など" oninput="S.note=this.value">'+S.note+'</textarea>';
    h+='</div>';
    h+='<button class="btn" id="nextBtn" onclick="tryNext()">内容を確認する →</button>';
    h+='<button class="bbk" onclick="back()">← もどる</button>';

  }else{
    var pur=purpose();
    var purName='';
    for(var i=0;i<p1list.length;i++){if(p1list[i].id===pur){purName=p1list[i].name;break;}}
    if(!purName){for(var i=0;i<p2list.length;i++){if(p2list[i].id===pur){purName=p2list[i].name;break;}}}
    var kc=null;for(var i=0;i<kuyoC.length;i++){if(kuyoC[i].id===S.kuyo){kc=kuyoC[i];break;}}
    var sty=null;for(var i=0;i<styles.length;i++){if(styles[i].id===S.style){sty=styles[i];break;}}
    var mood=null;for(var i=0;i<moods.length;i++){if(moods[i].id===S.mood){mood=moods[i];break;}}
    var pr=null;for(var i=0;i<prices.length;i++){if(prices[i].id===S.price){pr=prices[i];break;}}
    var d=S.calDate||new Date();
    h='<div class="card"><div class="sec">ご予約内容の確認</div>';
    h+='<div class="sr"><span class="sl">お名前</span><span>'+S.name+'</span></div>';
    if(S.tel) h+='<div class="sr"><span class="sl">電話番号</span><span>'+S.tel+'</span></div>';
    if(S.email) h+='<div class="sr"><span class="sl">メール</span><span style="font-size:12px">'+S.email+'</span></div>';
    h+='<div class="sr"><span class="sl">用途</span><span>'+purName+(kc?' / '+kc.name:'')+'</span></div>';
    if(sty) h+='<div class="sr"><span class="sl">スタイル</span><span>'+sty.icon+' '+sty.name+'</span></div>';
    if(mood) h+='<div class="sr"><span class="sl">色合い</span><span>'+mood.icon+' '+mood.name+'</span></div>';
    h+='<div class="sr"><span class="sl">ご予算</span><span>'+(S.price==='p2200'?'2,200円（一対）':pr?pr.label:S.custPrice)+'</span></div>';
    h+='<div class="sr"><span class="sl">来店日時</span><span>'+(d.getMonth()+1)+'/'+d.getDate()+'('+days[d.getDay()]+') '+S.time+'</span></div>';
    if(S.bag) h+='<div class="sr"><span class="sl">紙袋</span><span>あり（現地精算）</span></div>';
    if(S.card) h+='<div class="sr"><span class="sl">メッセージカード</span><span>あり（無料）</span></div>';
    if(S.note) h+='<div class="sr"><span class="sl">備考</span><span style="text-align:right;max-width:180px;font-size:12px">'+S.note+'</span></div>';
    h+='<div class="sr last"><span>ご予算</span><span>'+(S.price==='p2200'?'2,200円（一対）':pr?pr.label:S.custPrice)+'</span></div>';
    h+='</div>';
    h+='<div style="font-size:12px;color:#9a7060;background:#faf4f0;border:.5px solid #e8d8d0;border-radius:8px;padding:12px 14px;margin-bottom:1rem;line-height:1.8">この内容でよろしければ「予約を送信する」を押してください。<br><span style="color:#b8a89a">✦</span> ボタンを押すと<strong style="color:#9a7060">別のフォーム（確認画面）に移動します</strong>。<br><span style="color:#b8a89a">✦</span> 確認画面の「送信する」を押すと予約が完了します。<br><span style="color:#b8a89a">✦</span> 完了後、ご登録のメールアドレスに自動返信メールをお送りします。</div>';
    h+='<button class="btn" id="sbtn" onclick="sendForm()">予約を送信する ✉️</button>';
    h+='<button class="bbk" onclick="back()">← 修正する</button>';
  }
  c.innerHTML=h;
}

function pick(k,v){S[k]=v;render();}
function pickTime(t){S.time=t;render();}
function pickPrice(v){S.price=v;S.custPrice='';render();}
function selP1(v){S.purpose1=v;S.purpose2=null;S.step=2;render();}
function selP2(v){S.purpose2=v;S.purpose1=null;S.kuyo=null;S.style=null;S.mood=null;render();}
function tog(k){S[k]=!S[k];render();}
function go(){S.step++;render();}
function back(){S.step--;render();}

function tryNext(){
  if(!S.name.trim()){alert('お名前をご入力ください');return;}
  if(!S.tel.trim()){alert('電話番号をご入力ください');return;}
  if(!S.email.trim()){alert('メールアドレスをご入力ください');return;}
  if(!S.calDate){alert('来店日を選んでください');return;}
  if(!S.time){alert('来店時間を選んでください');return;}
  go();
}

function sendForm(){
  var btn=document.getElementById('sbtn');
  btn.textContent='送信中…';
  btn.disabled=true;

  var pur=purpose();
  var purName='';
  for(var i=0;i<p1list.length;i++){if(p1list[i].id===pur){purName=p1list[i].name;break;}}
  if(!purName){for(var i=0;i<p2list.length;i++){if(p2list[i].id===pur){purName=p2list[i].name;break;}}}
  var kc=null;for(var i=0;i<kuyoC.length;i++){if(kuyoC[i].id===S.kuyo){kc=kuyoC[i];break;}}
  var sty=null;for(var i=0;i<styles.length;i++){if(styles[i].id===S.style){sty=styles[i];break;}}
  var mood=null;for(var i=0;i<moods.length;i++){if(moods[i].id===S.mood){mood=moods[i];break;}}
  var pr=null;for(var i=0;i<prices.length;i++){if(prices[i].id===S.price){pr=prices[i];break;}}
  var d=S.calDate||new Date();
  var dateStr=(d.getMonth()+1)+'/'+d.getDate()+'('+days[d.getDay()]+') '+S.time;

  var body={
    name: S.name,
    tel: S.tel||'未入力',
    email: S.email||'未入力',
    purpose: purName+(kc?' / '+kc.name:''),
    style: sty?sty.icon+' '+sty.name:'',
    mood: mood?mood.icon+' '+mood.name:'',
    price: S.price==='p2200'?'2,200円（一対）':pr?pr.label:S.custPrice,
    datetime: dateStr,
    bag: S.bag?'あり（現地精算）':'なし',
    card: S.card?'あり（無料）':'なし',
    note: S.note||'なし',
    _subject: '【ご来店予約】'+S.name+'様 '+dateStr,
    _replyto: S.email||''
  };

  fetch('https://formspree.io/f/mvznrvgo',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(body)
  })
  .then(function(res){
    if(res.ok){
      document.getElementById('main').innerHTML='<div class="done"><div class="dicon">🌿</div><div class="dtitle">ご予約ありがとうございます</div><div class="dmsg">'+S.name+'さん、ご予約ありがとうございます。<br><br>内容を確認の上、こちらから確認事項がある際は1〜2営業日以内にメールにて改めてご連絡いたします。<br>ない場合は、確定として承ります。<br><br>ご不明点やご質問がありましたら、お気軽にお問い合わせください。</div></div>';
      document.getElementById('steps').innerHTML='';submitToGoogle();
    }else{
      btn.textContent='予約を送信する ✉️';
      btn.disabled=false;
      alert('送信に失敗しました。お手数ですがお電話でご連絡ください。');
    }
  })
  .catch(function(){
    btn.textContent='予約を送信する ✉️';
    btn.disabled=false;
    alert('通信エラーが発生しました。お手数ですがお電話でご連絡ください。');
  });
}

function submitToGoogle(){
  var pur=purpose();
  var purName='';
  for(var i=0;i<p1list.length;i++){if(p1list[i].id===pur){purName=p1list[i].name;break;}}
  if(!purName){for(var i=0;i<p2list.length;i++){if(p2list[i].id===pur){purName=p2list[i].name;break;}}}
  var kc=null;for(var i=0;i<kuyoC.length;i++){if(kuyoC[i].id===S.kuyo){kc=kuyoC[i];break;}}
  var sty=null;for(var i=0;i<styles.length;i++){if(styles[i].id===S.style){sty=styles[i];break;}}
  var mood=null;for(var i=0;i<moods.length;i++){if(moods[i].id===S.mood){mood=moods[i];break;}}
  var pr=null;for(var i=0;i<prices.length;i++){if(prices[i].id===S.price){pr=prices[i];break;}}
  var d=S.calDate||new Date();
  var dateStr=d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();

  var params=new URLSearchParams();
  params.append('entry.2126194840', purName+(kc?' / '+kc.name:''));
  params.append('entry.686498998', mood?mood.name:(sty?sty.name:''));
  params.append('entry.1240209201', dateStr);
  params.append('entry.1312457891', S.time||'');
  params.append('entry.1548757782', S.price==='p2200'?'2,200円（一対）':pr?pr.label:S.custPrice);
  params.append('entry.1424076277', S.name);
  params.append('entry.1396544758', S.tel||'');

  var img=new Image();
  img.src='https://docs.google.com/forms/d/e/1FAIpQLSfN2zu1qsLyIZq6UsC-y3YcHAIOK-3uzUvVhBMIECDWwKOLPA/formResponse?'+params.toString()+'&submit=Submit';
}

render();
</script>
