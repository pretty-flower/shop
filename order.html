  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf7f2; --warm-white: #f5f0e8; --sand: #e8dfd0;
      --clay: #c9b8a0; --taupe: #8b7660; --bark: #5a4535; --deep: #2d1f14;

    body { font-family: 'Shippori Mincho', serif; background: var(--cream); color: var(--deep); min-height: 100vh; }

    header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--sand); background: var(--cream); position: sticky; top: 0; z-index: 10; }

    .page-header-jp { font-size: 14px; letter-spacing: 0.35em; color: var(--clay); margin-top: 12px; position: relative; }
    .page-header-note { margin-top: 32px; font-size: 13px; line-height: 2; color: var(--clay); position: relative; }

    .form-wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 80px; }

    .notice { font-size: 12px; color: #9a7060; background: #faf4f0; border: .5px solid #e8d8d0; border-radius: 8px; padding: 8px 12px; text-align: center; margin-bottom: 1.5rem; }

    .card { background: #fff; border: .5px solid #e8e0d8; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }

    .field-group { margin-bottom: 1.25rem; }
    .field-label { font-size: 12px; color: #a08878; letter-spacing: .1em; display: block; margin-bottom: 6px; }
    .req { color: #c08878; font-size: 10px; margin-left: 4px; }

    .field-row { display: flex; gap: 8px; }
    .field-row input { flex: 1; }

    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; border: .5px solid #e0d8d0; border-radius: 8px;
      padding: 10px 12px; font-size: 14px; background: #fff; color: #333;
      font-family: 'Shippori Mincho', serif;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus {
      outline: none; border-color: #b8a89a;
    }

    .submit-btn {
      width: 100%; padding: 14px; background: #b8a89a; color: #fff;
      border: none; border-radius: 12px; font-size: 15px; cursor: pointer;
      margin-top: 1rem; transition: background .2s;
      font-family: 'Shippori Mincho', serif; letter-spacing: 0.1em;

    .submit-btn:hover { background: #a89888; }

    .powered { text-align: center; margin-top: 1rem; font-size: 11px; color: #c9b8a0; }
    .powered a { color: #c9b8a0; text-decoration: none; }

    footer { background: var(--deep); color: var(--clay); padding: 32px 40px; text-align: center; font-size: 12px; letter-spacing: 0.2em; }
    footer a { color: var(--clay); text-decoration: none; margin: 0 12px; }

    #back-to-top {
      position: fixed; bottom: 28px; right: 24px; width: 48px; height: 48px;
      border-radius: 50%; background: var(--bark); color: var(--cream);
      border: none; font-size: 16px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18); opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s, transform 0.35s, background 0.2s; z-index: 999;
      display: flex; align-items: center; justify-content: center;
    }
    #back-to-top.visible { opacity: 1; transform: translateY(0); }
    #back-to-top:hover { background: var(--rose-muted); }

    @media(max-width:600px) {
      header { padding: 16px 20px; }
